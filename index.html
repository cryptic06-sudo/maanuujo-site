<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maanuujo Digit Analyzer</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#0b1020;
 color:white;
}
header{
 text-align:center;
 padding:22px 10px;
 background:#151c33;
}
h1{margin:0;font-size:25px}
p{color:#aeb8d0}
.container{max-width:700px;margin:auto;padding:15px}
.card{
 background:#151c33;
 border:1px solid #293452;
 border-radius:14px;
 padding:18px;
 margin-bottom:15px;
}
select,button{
 width:100%;
 padding:13px;
 margin-top:8px;
 border-radius:9px;
 font-size:16px;
}
select{
 background:#0b1020;
 color:white;
 border:1px solid #394564;
}
button{
 border:0;
 background:#20d47a;
 font-weight:bold;
}
.stop{background:#ef5363;color:white}
.status{
 text-align:center;
 padding:12px;
 background:#0b1020;
 border-radius:9px;
 margin-bottom:15px;
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}
.box{
 background:#0b1020;
 padding:18px 8px;
 border-radius:10px;
 text-align:center;
}
.box small{color:#9ca8c5}
.value{
 display:block;
 font-size:27px;
 font-weight:bold;
 margin-top:8px;
}
.green{color:#20d47a}
.red{color:#ef5363}
.yellow{color:#ffd45a}
.digits{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:12px;
}
.digit{
 width:38px;
 height:38px;
 border-radius:50%;
 background:#293452;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
}
.row{
 display:flex;
 justify-content:space-between;
 padding:9px 2px;
 border-bottom:1px solid #293452;
}
</style>
</head>

<body>

<header>
<h1>🚀 Maanuujo Digit Analyzer</h1>
<p>Live Deriv Digit Analysis</p>
</header>

<div class="container">

<div class="card">
<div id="status" class="status">🔴 Disconnected</div>

<label>Market</label>
<select id="market">
<option value="R_10">Volatility 10 Index</option>
<option value="R_25">Volatility 25 Index</option>
<option value="R_50">Volatility 50 Index</option>
<option value="R_75">Volatility 75 Index</option>
<option value="R_100">Volatility 100 Index</option>
</select>

<button onclick="start()">▶ START ANALYZER</button>
<button class="stop" onclick="stop()">■ STOP</button>
</div>

<div class="card">
<div class="grid">

<div class="box">
<small>TICKS</small>
<span id="ticks" class="value">0</span>
</div>

<div class="box">
<small>LAST DIGIT</small>
<span id="last" class="value">-</span>
</div>

<div class="box">
<small>EVEN</small>
<span id="even" class="value green">0%</span>
</div>

<div class="box">
<small>ODD</small>
<span id="odd" class="value red">0%</span>
</div>

</div>
</div>

<div class="card">
<div class="box">
<small>EVEN / ODD SIGNAL</small>
<span id="signal" class="value yellow">WAITING</span>
</div>
</div>

<div class="card">
<label>Target Digit</label>
<select id="target" onchange="analyze()">
<option>0</option><option>1</option><option>2</option>
<option>3</option><option>4</option><option>5</option>
<option>6</option><option>7</option><option>8</option>
<option>9</option>
</select>

<div class="grid" style="margin-top:12px">

<div class="box">
<small>MATCHES</small>
<span id="matches" class="value green">0%</span>
</div>

<div class="box">
<small>DIFFERS</small>
<span id="differs" class="value red">0%</span>
</div>

</div>
</div>

<div class="card">
<h3>Recent Digits</h3>
<div id="digits" class="digits"></div>
</div>

<div class="card">
<h3>Digit Frequency</h3>
<div id="frequency"></div>
</div>

</div>

let ws=null;
let data=[]
